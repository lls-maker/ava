<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <title>AVA - Master Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center text-slate-100">
    <div class="bg-slate-800 p-8 rounded-2xl w-full max-w-sm border border-slate-700">
        <h2 class="text-xl font-bold text-rose-400 mb-4 text-center">Painel Master</h2>
        <div class="space-y-3">
            <input type="password" id="pass" placeholder="Chave Mestra" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm">
            <button onclick="entrar()" class="w-full bg-rose-600 hover:bg-rose-500 py-2 rounded-lg text-sm font-semibold">Aceder</button>
        </div>
    </div>
    <script>
        function entrar() {
            if(document.getElementById('pass').value === "minhasenhasecreta") {
                alert("Acesso autorizado! (Aqui entram os controlos de professores e pagamentos)");
            } else {
                alert("Senha incorreta!");
            }
        }
    </script>
</body>
</html>
