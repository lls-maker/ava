<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVA - Ambiente Virtual de Aprendizagem</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#4338ca">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col">

    <!-- Navbar -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">AVA - Ambiente Virtual de Aprendizagem</h1>
            
            <div class="flex items-center gap-4">
                <!-- Sininho de Notificações para Alunos -->
                <div id="notificationArea" class="relative hidden">
                    <button onclick="toggleNotifications()" class="relative p-2 text-white hover:bg-indigo-700 rounded-full transition">
                        🔔
                        <span id="notifBadge" class="absolute top-0 right-0 bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full hidden">0</span>
                    </button>
                    
                    <div id="notifDropdown" class="hidden absolute right-0 mt-2 w-72 bg-white text-slate-800 rounded-2xl shadow-xl border border-slate-100 z-50 p-3">
                        <h3 class="font-bold text-sm text-slate-500 border-b pb-2 mb-2">Novos Materiais</h3>
                        <div id="notifList" class="max-h-60 overflow-y-auto space-y-2">
                            <p class="text-slate-400 text-center py-2 text-sm">Nenhuma novidade.</p>
                        </div>
                    </div>
                </div>

                <span id="userInfo" class="text-sm font-medium bg-indigo-700 px-3 py-1.5 rounded-full">Carregando...</span>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full grid grid-cols-1 md:grid-cols-4 gap-6">
        
        <!-- Sidebar de Matérias -->
        <aside class="md:col-span-1 bg-white p-4 rounded-2xl shadow-sm border border-slate-100 h-fit">
            <h2 class="font-bold text-slate-700 mb-3 text-lg">Matérias</h2>
            <div id="subjectsList" class="space-y-1">
                <!-- Preenchido via script -->
            </div>
        </aside>

        <!-- Área de Conteúdos e Upload -->
        <section class="md:col-span-3 space-y-6">
            
            <!-- Painel do Professor (Upload) -->
            <div id="teacherPanel" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-indigo-100">
                <h3 class="font-bold text-indigo-900 text-lg mb-4">Publicar Novo Material</h3>
                <form id="uploadForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Título da Matéria / Aula</label>
                        <input type="text" id="matTitle" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Selecionar Matéria</label>
                        <select id="matSubject" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                            <!-- Preenchido via script -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Ficheiro</label>
                        <input type="file" id="matFile" required class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
                    </div>
                    <button type="submit" id="btnUpload" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl transition">
                        Publicar Material Rapidamente
                    </button>
                </form>
            </div>

            <!-- Lista de Materiais -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="font-bold text-slate-800 text-lg mb-4">Materiais Disponíveis</h3>
                <div id="materialsList" class="space-y-3">
                    <p class="text-slate-400">A carregar conteúdos...</p>
                </div>
            </div>

        </section>
    </main>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "seu-projeto.firebaseapp.com",
            projectId: "seu-projeto",
            storageBucket: "seu-projeto.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456:web:abcd"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUserData = { role: 'aluno', name: 'Estudante' }; 
        let subjects = ['Matemática', 'Português', 'Programação', 'História'];
        let materials = [];

        window.addEventListener('DOMContentLoaded', () => {
            initApp();
        });

        async function initApp() {
            setupUserInterface();
            await loadDataFromCloud();
            setupUploadListener();
        }

        function setupUserInterface() {
            const userInfo = document.getElementById('userInfo');
            const teacherPanel = document.getElementById('teacherPanel');
            
            userInfo.innerText = `${currentUserData.name} (${currentUserData.role.toUpperCase()})`;

            if (currentUserData.role === 'professor') {
                teacherPanel.classList.remove('hidden');
            }
        }

        async function loadDataFromCloud() {
            try {
                const matSnap = await getDocs(collection(db, "materials"));
                materials = matSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                materials.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                renderSubjects();
                renderMaterials();

                if (currentUserData && currentUserData.role === 'aluno') {
                    updateStudentNotifications();
                }
            } catch (err) {
                console.error("Erro ao carregar do Firestore:", err);
            }
        }

        function renderSubjects() {
            const list = document.getElementById('subjectsList');
            const select = document.getElementById('matSubject');

            list.innerHTML = `<button onclick="filterBySubject('Todos')" class="w-full text-left px-3 py-2 rounded-xl bg-indigo-50 text-indigo-700 font-medium transition">Todas as Matérias</button>` +
                subjects.map(s => `<button onclick="filterBySubject('${s}')" class="w-full text-left px-3 py-2 rounded-xl hover:bg-slate-100 text-slate-600 font-medium transition">${s}</button>`).join('');

            if (select) {
                select.innerHTML = subjects.map(s => `<option value="${s}">${s}</option>`).join('');
            }
        }

        function renderMaterials(filteredSubject = 'Todos') {
            const container = document.getElementById('materialsList');
            let data = materials;

            if (filteredSubject !== 'Todos') {
                data = materials.filter(m => m.subject === filteredSubject);
            }

            if (data.length === 0) {
                container.innerHTML = `<p class="text-slate-400 text-center py-6">Nenhum material encontrado.</p>`;
                return;
            }

            container.innerHTML = data.map(m => `
                <div class="p-4 border border-slate-100 rounded-2xl flex justify-between items-center hover:bg-slate-50 transition">
                    <div>
                        <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full">${m.subject}</span>
                        <h4 class="font-bold text-slate-800 mt-1">${m.title}</h4>
                        <span class="text-xs text-slate-400">Enviado em: ${m.date || 'Recente'}</span>
                    </div>
                    <a href="${m.fileData}" download="${m.fileName || 'material'}" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-medium hover:bg-indigo-700 transition">
                        Descarregar
                    </a>
                </div>
            `).join('');
        }

        window.filterBySubject = function(subject) {
            renderMaterials(subject);
        };

        function setupUploadListener() {
            const form = document.getElementById('uploadForm');
            if (!form) return;

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const title = document.getElementById('matTitle').value;
                const subject = document.getElementById('matSubject').value;
                const fileInput = document.getElementById('matFile');
                const btn = document.getElementById('btnUpload');

                if (fileInput.files.length === 0) return;
                const file = fileInput.files[0];

                btn.innerText = "A enviar rapidamente...";
                btn.disabled = true;

                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async () => {
                    try {
                        const newMaterial = {
                            title,
                            subject,
                            fileName: file.name,
                            fileData: reader.result,
                            date: new Date().toLocaleDateString('pt-BR'),
                            timestamp: Date.now()
                        };

                        await addDoc(collection(db, "materials"), newMaterial);
                        
                        form.reset();
                        alert("Material publicado com sucesso!");
                        await loadDataFromCloud();
                    } catch (err) {
                        console.error("Erro ao enviar:", err);
                        alert("Erro ao publicar material.");
                    } finally {
                        btn.innerText = "Publicar Material Rapidamente";
                        btn.disabled = false;
                    }
                };
            });
        }

        window.toggleNotifications = function() {
            const dropdown = document.getElementById('notifDropdown');
            if (dropdown) dropdown.classList.toggle('hidden');
        };

        function updateStudentNotifications() {
            const notifArea = document.getElementById('notificationArea');
            const notifBadge = document.getElementById('notifBadge');
            const notifList = document.getElementById('notifList');

            if (!notifArea || !notifBadge || !notifList) return;

            notifArea.classList.remove('hidden');

            if (materials.length === 0) {
                notifBadge.classList.add('hidden');
                notifList.innerHTML = `<p class="text-slate-400 text-center py-2 text-sm">Nenhuma novidade.</p>`;
                return;
            }

            notifBadge.innerText = materials.length;
            notifBadge.classList.remove('hidden');

            notifList.innerHTML = materials.slice(0, 5).map(m => `
                <div onclick="filterBySubject('${m.subject}'); toggleNotifications();" class="p-2 hover:bg-slate-50 rounded-xl cursor-pointer transition border-b border-slate-50 last:border-0">
                    <span class="font-bold text-indigo-600 block text-xs">${m.subject}</span>
                    <span class="text-slate-700 font-medium block truncate text-sm">${m.title}</span>
                    <span class="text-[10px] text-slate-400">${m.date || 'Recente'}</span>
                </div>
            `).join('');
        }
    </script>

    <!-- Registo do Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log("Service Worker registado com sucesso!"))
                .catch(err => console.log("Erro no Service Worker:", err));
        }
    </script>
</body>
</html>
