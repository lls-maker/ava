<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVA - Ambiente Virtual de Aprendizagem</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body class="h-full flex flex-col text-slate-100 font-sans">

    <!-- ECRÃ DE LOGIN / AUTENTICAÇÃO PRINCIPAL -->
    <div id="authScreen" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
            <h1 class="text-3xl font-bold text-center mb-1 text-indigo-400">AVA</h1>
            <p class="text-center text-slate-400 mb-6 text-sm">Ambiente Virtual de Aprendizagem</p>

            <!-- Formulário Simples (Serve para Alunos e Professores) -->
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Nome de Utilizador</label>
                    <input type="text" id="loginUser" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 focus:outline-none focus:border-indigo-500 text-sm" placeholder="Digite o seu utilizador">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Palavra-passe</label>
                    <input type="password" id="loginSenha" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 focus:outline-none focus:border-indigo-500 text-sm" placeholder="••••••••">
                </div>
                
                <button onclick="fazerLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg transition-colors text-sm">Entrar na Conta</button>
                
                <!-- Botão de Suporte / Pagamento para Professores -->
                <button onclick="abrirSuporte()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium py-2.5 rounded-lg transition-colors text-sm flex items-center justify-center gap-2">
                    💬 Suporte / Ativação (R$ 29,90)
                </button>
            </div>
        </div>
    </div>

    <!-- ECRÃ DE SUPORTE / CHAT (Para envio de comprovativo) -->
    <div id="supportScreen" class="flex-1 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
            <h2 class="text-2xl font-bold text-amber-400 mb-2 text-center">Suporte & Ativação</h2>
            <p class="text-slate-300 mb-4 text-xs text-center">Envie a sua mensagem informando o seu utilizador e o comprovativo do plano (R$ 29,90) para liberação.</p>
            
            <div class="bg-slate-900 border border-slate-700 rounded-xl p-3 h-40 overflow-y-auto flex flex-col space-y-2 mb-4 text-xs" id="chatBox">
                <p class="text-slate-500 text-center my-auto">Escreva a sua mensagem abaixo...</p>
            </div>

            <div class="flex gap-2 mb-3">
                <input type="text" id="inputMsg" placeholder="Sua mensagem..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500">
                <button onclick="enviarMsgSuporte()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-3 py-2 rounded-lg text-xs">Enviar</button>
            </div>

            <button onclick="voltarLogin()" class="w-full text-slate-400 text-xs hover:underline text-center">← Voltar ao Login</button>
        </div>
    </div>

    <!-- DASHBOARD PRINCIPAL DO UTILIZADOR -->
    <div id="appScreen" class="h-full flex hidden">
        <aside class="w-64 bg-slate-800 border-r border-slate-700 flex flex-col justify-between p-4">
            <div>
                <h2 class="text-xl font-bold text-indigo-400 mb-8 px-2">AVA Painel</h2>
                <nav class="space-y-2">
                    <a href="#" class="flex items-center gap-3 px-4 py-2.5 bg-indigo-600 text-white rounded-lg font-medium text-sm">🏠 Início</a>
                </nav>
            </div>
            <div class="border-t border-slate-700 pt-4">
                <span id="userNameDisplay" class="font-medium text-sm text-slate-200 block mb-3 px-2">Utilizador</span>
                <button onclick="fazerLogout()" class="w-full bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white font-medium py-2 rounded-lg transition-colors text-sm">Terminar Sessão</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-y-auto bg-slate-900 p-8">
            <h1 class="text-3xl font-bold mb-2">Bem-vindo ao AVA</h1>
            <p id="userRoleInfo" class="text-slate-400 text-sm">Ambiente carregado com sucesso.</p>
        </main>
    </div>

    <!-- SCRIPT SIMPLES E DIRETO -->
    <script>
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_AUTH_DOMAIN",
            databaseURL: "SUA_DATABASE_URL",
            projectId: "SEU_PROJECT_ID",
            storageBucket: "SUA_STORAGE_BUCKET",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        try {
            firebase.initializeApp(firebaseConfig);
        } catch(e) {}

        const db = firebase.database();

        function fazerLogin() {
            const user = document.getElementById('loginUser').value.trim().toLowerCase();
            const senha = document.getElementById('loginSenha').value;

            if(!user || !senha) return alert('Preencha todos os campos!');

            // Simulação de login limpa e direta
            localStorage.setItem('ava_user', user);
            carregarApp(user);
        }

        function carregarApp(username) {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('appScreen').classList.remove('hidden');
            document.getElementById('userNameDisplay').textContent = username;
            document.getElementById('userRoleInfo').textContent = `Sessão ativa para: ${username}`;
        }

        function abrirSuporte() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('supportScreen').classList.remove('hidden');
        }

        function voltarLogin() {
            document.getElementById('supportScreen').classList.add('hidden');
            document.getElementById('authScreen').classList.remove('hidden');
        }

        function enviarMsgSuporte() {
            const txt = document.getElementById('inputMsg').value.trim();
            if(!txt) return;
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div class="text-right text-indigo-400"><b>Você:</b> ${txt}</div>`;
            document.getElementById('inputMsg').value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function fazerLogout() {
            localStorage.removeItem('ava_user');
            location.reload();
        }

        // Verifica se já estava logado
        window.onload = function() {
            const saved = localStorage.getItem('ava_user');
            if(saved) carregarApp(saved);
        }
    </script>
</body>
</html>
